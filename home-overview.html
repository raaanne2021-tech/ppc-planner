<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPC Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F5EFE4;--card:#fff;--yellow:#F5D060;--pink:#F0A0B4;--sage:#A8C878;--lav:#C0A8E0;--text:#1E1C18;--side:#1E1C18;--muted:rgba(30,28,24,.45);--bdr:rgba(30,28,24,.1);--r:16px;--f:'Outfit',sans-serif}
body{background:var(--bg);font-family:var(--f);color:var(--text);padding:20px 18px 32px;min-height:100vh}
.wrap{max-width:760px;margin:0 auto}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--bdr)}
.hdr-t{font-size:24px;font-weight:800;letter-spacing:-.02em}.hdr-t span{color:#C07090}
.hdr-sub{font-size:12px;color:var(--muted);margin-top:3px}.hdr-date{font-size:12px;font-weight:600;color:var(--muted)}
.sync{font-size:11px;font-weight:600;color:var(--muted);background:transparent;border:1px solid var(--bdr);border-radius:8px;padding:4px 10px;cursor:pointer;font-family:var(--f);margin-top:4px;transition:all .15s}.sync:hover{border-color:var(--text);color:var(--text)}
.sb{border-radius:10px;padding:8px 14px;margin-bottom:12px;font-size:12px;font-weight:500;display:flex;align-items:center}.sb-ok{background:rgba(122,140,110,.15);color:#607850}.sb-err{background:rgba(192,83,58,.12);color:#C04040}.sb-info{background:rgba(192,120,48,.12);color:#A07020}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.sc{border-radius:var(--r);padding:14px;position:relative;overflow:hidden}.sc.yl{background:var(--yellow)}.sc.pk{background:var(--pink)}.sc.sg2{background:var(--sage)}.sc.lv{background:var(--lav)}
.sl{font-size:9px;font-weight:600;color:rgba(30,28,24,.5);letter-spacing:.04em;text-transform:uppercase;margin-bottom:5px}.sn{font-size:28px;font-weight:800;line-height:1;letter-spacing:-.02em}.ss{font-size:9px;font-weight:500;color:rgba(30,28,24,.45);margin-top:3px}.si{position:absolute;bottom:8px;right:10px;font-size:20px;opacity:.2}
.og{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pn{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 2px 12px rgba(30,28,24,.07)}
.ph{padding:11px 14px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between}.pt{font-size:13px;font-weight:700}
.pd{padding:12px 14px;max-height:200px;overflow-y:auto}
.tw{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;background:var(--bg);margin-bottom:4px;font-size:12px}.tw:hover{background:#EDE7DC}
.cb-s{width:14px;height:14px;border-radius:4px;border:1.5px solid rgba(30,28,24,.2);background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center}.cb-s.dn{background:var(--sage);border-color:var(--sage)}.cb-s.dn::after{content:'';width:3px;height:6px;border-right:1.5px solid var(--side);border-bottom:1.5px solid var(--side);transform:rotate(45deg) translate(-1px,-1px);display:block}
.tx-s{flex:1;font-size:12px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tx-s.dn{text-decoration:line-through;color:var(--muted)}
.tg{font-size:9px;font-weight:600;padding:2px 6px;border-radius:16px;flex-shrink:0;white-space:nowrap}
.tg-t{background:#FFE8E0;color:#C04040}.tg-d{background:#E0F4E0;color:#407040}.tg-p{background:#E8E0F4;color:#6848A0}.tg-o{background:#F0ECE4;color:rgba(30,28,24,.5)}.tg-j{background:#E0E8F4;color:#405880}.tg-n{background:#FFF0E8;color:#906040}
.le-s{padding:10px;border-radius:9px;background:var(--bg);margin-bottom:4px}.le-s:hover{background:#EDE7DC}
.ll-s{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;color:#608050}.lt-s{font-size:12px;font-weight:500;line-height:1.4}
.ne-s{padding:8px 10px;border-radius:9px;background:var(--bg);margin-bottom:4px;display:flex;align-items:center;gap:8px;font-size:12px}.ne-s:hover{background:#EDE7DC}
.em{text-align:center;padding:16px 0;font-size:12px;color:var(--muted)}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:rgba(30,28,24,.12);border-radius:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr"><div><div class="hdr-t" id="greeting">Good morning, <span>Rae.</span></div><div class="hdr-sub" id="topSub">Loading overview…</div></div><div class="hdr-r"><div class="hdr-date" id="metaDate"></div><button class="sync" onclick="loadAll()">↻ Sync All</button></div></div>
  <div id="sBar" style="display:none"></div>
  <div class="sg">
    <div class="sc yl"><div class="sl">Tasks Today</div><div class="sn" id="h1">-</div><div class="ss" id="h1s">loading</div><div class="si">📋</div></div>
    <div class="sc pk"><div class="sl">Done Today</div><div class="sn" id="h2">-</div><div class="ss" id="h2s">loading</div><div class="si">✓</div></div>
    <div class="sc lv"><div class="sl">Active Projects</div><div class="sn" id="h3">-</div><div class="ss">in progress</div><div class="si">🚧</div></div>
    <div class="sc sg2"><div class="sl">Logs Today</div><div class="sn" id="h4">-</div><div class="ss">entries</div><div class="si">📝</div></div>
  </div>
  <div class="og">
    <div class="pn"><div class="ph"><div class="pt">◈ Today's Tasks</div></div><div class="pd" id="mTasks"><div class="em">Loading…</div></div></div>
    <div class="pn"><div class="ph"><div class="pt">◎ Daily Recap</div></div><div class="pd" id="mRecap"><div class="em">Loading…</div></div></div>
    <div class="pn"><div class="ph"><div class="pt">≡ Active Projects</div></div><div class="pd" id="mProj"><div class="em">Loading…</div></div></div>
    <div class="pn"><div class="ph"><div class="pt">◻ Recent Notes</div></div><div class="pd" id="mNotes"><div class="em">Loading…</div></div></div>
  </div>
</div>
<script>
const W='https://ppc-taskplanner.rachel-f0b.workers.dev';
const DB_T='30634595b2aa807fbe6aeddda8aa124a',DB_L='35e34595b2aa80828a81dada51401d22',DB_P='35934595b2aa8034a4eed7794f61ad8d',DB_N='35934595b2aa8021a54af97806049a38';
let tasks=[],recaps=[],projects=[],notes=[];
function toYMD(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function dD(y){if(!y)return'';const t=toYMD(new Date());if(y===t)return'Today';return new Date(y+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}
function ss(m,t){const b=document.getElementById('sBar');b.className='sb sb-'+t;b.textContent=m;b.style.display='flex';if(t!=='err')setTimeout(()=>b.style.display='none',3000)}
function ago(iso){const d=new Date(iso),now=new Date(),m=Math.floor((now-d)/60000);if(m<60)return m+'m';const h=Math.floor(m/60);if(h<24)return h+'h';return Math.floor(h/24)+'d'}
function initUI(){const n=new Date(),h=n.getHours(),g=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
document.getElementById('greeting').innerHTML=`${g}, <span>Rae.</span>`;
const ds=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],ms=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
document.getElementById('metaDate').textContent=`${ds[n.getDay()]}, ${ms[n.getMonth()]} ${n.getDate()}`}
async function q(db,body={}){const r=await fetch(`${W}/query/${db}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return r.json()}
function pn(id){const c=id.replaceAll('-','');const p=projects.find(x=>x.id.replaceAll('-','')=== c);return p?p.name:''}

async function loadAll(){ss('Syncing all…','info');try{
const[t,l,p,n]=await Promise.all([q(DB_T,{page_size:100}),q(DB_L,{page_size:30,sorts:[{property:'Date',direction:'descending'}]}),q(DB_P,{page_size:50}),q(DB_N,{page_size:30,sorts:[{property:'Last edited time',direction:'descending'}]})]);
tasks=(t.results||[]).map(x=>{const r=x.properties||{};return{id:x.id,title:r['Task']?.title?.[0]?.plain_text||'Untitled',status:r['Status']?.status?.name||'Not started',priority:r['Priority Type']?.select?.name||'',doDate:r['Do Date']?.date?.start||null}});
recaps=(l.results||[]).map(x=>{const r=x.properties||{};return{done:r["What's done?"]?.title?.[0]?.plain_text||'',next:r["What's next?"]?.rich_text?.[0]?.plain_text||'',date:r['Date']?.date?.start||null,projIds:(r["🚧 Projects "]?.relation||[]).map(y=>y.id)}});
projects=(p.results||[]).map(x=>({id:x.id,name:x.properties?.['Name']?.title?.[0]?.plain_text||'Untitled',status:x.properties?.['Status']?.status?.name||''}));
notes=(n.results||[]).map(x=>{const r=x.properties||{};return{title:r['Page']?.title?.[0]?.plain_text||'Untitled',types:(r['Type']?.multi_select||[]).map(y=>y.name),edited:r['Last edited time']?.last_edited_time||''}});
render();ss('All synced ✓','ok');document.getElementById('topSub').textContent=`${tasks.length} tasks · ${projects.filter(x=>x.status==='In progress').length} projects · ${notes.length} notes`}catch(e){ss('Error loading.','err')}}

function render(){const tdy=toYMD(new Date());
const tdyT=tasks.filter(x=>x.doDate===tdy),tdyD=tdyT.filter(x=>x.status==='Done'),actP=projects.filter(x=>x.status==='In progress'),tdyL=recaps.filter(x=>x.date===tdy);
document.getElementById('h1').textContent=tdyT.length;document.getElementById('h1s').textContent=tdyT.length?`${tdyT.length-tdyD.length} remaining`:'none';
document.getElementById('h2').textContent=tdyD.length;document.getElementById('h2s').textContent=tdyD.length===tdyT.length&&tdyT.length?'all done! 🎉':`of ${tdyT.length}`;
document.getElementById('h3').textContent=actP.length;document.getElementById('h4').textContent=tdyL.length;

// Tasks
const mt=tdyT.slice(0,6);document.getElementById('mTasks').innerHTML=mt.length?mt.map(x=>{const dn=x.status==='Done';
const st=dn?'<span class="tg tg-d">Done</span>':x.priority==='Priority today'?'<span class="tg tg-t">Priority</span>':'<span class="tg tg-o">To do</span>';
return `<div class="tw"><div class="cb-s ${dn?'dn':''}"></div><div class="tx-s ${dn?'dn':''}">${esc(x.title)}</div>${st}</div>`}).join(''):'<div class="em">No tasks today</div>';

// Recaps
document.getElementById('mRecap').innerHTML=tdyL.length?tdyL.slice(0,3).map(x=>{const pt=x.projIds.map(id=>{const n=pn(id);return n?`<span class="tg tg-j">${esc(n)}</span>`:''}).join('');
return `<div class="le-s"><div class="ll-s">✅ Done</div><div class="lt-s">${esc(x.done||'(empty)')}</div>${pt?`<div style="margin-top:6px">${pt}</div>`:''}</div>`}).join(''):'<div class="em">No recaps today</div>';

// Projects
document.getElementById('mProj').innerHTML=actP.length?actP.map(x=>
`<div class="ne-s"><span style="font-size:14px">🚧</span><div class="tx-s">${esc(x.name)}</div><span class="tg tg-p">Active</span></div>`).join(''):'<div class="em">No active projects</div>';

// Notes
document.getElementById('mNotes').innerHTML=notes.length?notes.slice(0,5).map(x=>{const tTags=x.types.slice(0,1).map(t=>`<span class="tg tg-n">${t}</span>`).join('');const a=x.edited?ago(x.edited):'';
return `<div class="ne-s"><span style="font-size:14px">📄</span><div style="flex:1;min-width:0"><div class="tx-s">${esc(x.title)}</div></div>${tTags}<span style="font-size:10px;color:var(--muted)">${a}</span></div>`}).join(''):'<div class="em">No notes</div>'}

initUI();loadAll();
</script>
</body>
</html>
