<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPC Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F5EFE4; --sidebar: #1E1C18; --card: #FFFFFF;
    --yellow: #F5D060; --pink: #F0A0B4; --sage: #A8C878; --lavender: #C0A8E0;
    --text: #1E1C18; --muted: rgba(30,28,24,.45); --border: rgba(30,28,24,.1);
    --radius: 16px; --font: 'Outfit', sans-serif;
  }
  html, body { height: 100%; }
  body { background: var(--bg); font-family: var(--font); color: var(--text); display: flex; min-height: 100vh; }

  /* LAYOUT */
  .app { display: flex; width: 100%; min-height: 100vh; }

  /* SIDEBAR */
  .sidebar { width: 196px; flex-shrink: 0; background: var(--sidebar); display: flex; flex-direction: column; padding: 22px 0 18px; position: sticky; top: 0; height: 100vh; }
  .brand { padding: 0 18px 20px; border-bottom: 1px solid rgba(255,255,255,.08); margin-bottom: 8px; }
  .brand-name { font-size: 16px; font-weight: 800; color: #fff; letter-spacing: -.01em; }
  .brand-sub { font-size: 10px; font-weight: 500; color: rgba(255,255,255,.3); letter-spacing: .06em; text-transform: uppercase; margin-top: 2px; }
  .nav-sec { padding: 10px 14px 4px; font-size: 9px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.2); }
  .nav-item { display: flex; align-items: center; gap: 9px; padding: 9px 14px; margin: 1px 8px; border-radius: 10px; font-size: 13px; font-weight: 500; color: rgba(255,255,255,.5); cursor: pointer; transition: all .15s; user-select: none; }
  .nav-item:hover { background: rgba(255,255,255,.07); color: rgba(255,255,255,.8); }
  .nav-item.active { background: rgba(255,255,255,.12); color: #fff; font-weight: 600; }
  .nav-icon { font-size: 14px; width: 18px; text-align: center; flex-shrink: 0; }
  .nav-badge { margin-left: auto; background: var(--yellow); color: var(--sidebar); font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 10px; min-width: 18px; text-align: center; }
  .sidebar-footer { margin-top: auto; padding: 14px 10px 0; border-top: 1px solid rgba(255,255,255,.06); }
  .user-chip { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,.06); }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--yellow); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--sidebar); flex-shrink: 0; }
  .user-name { font-size: 12px; font-weight: 600; color: rgba(255,255,255,.85); }
  .user-role { font-size: 10px; color: rgba(255,255,255,.3); }

  /* MAIN */
  .main { flex: 1; padding: 24px 22px 32px; overflow-y: auto; min-width: 0; }

  /* TOP ROW */
  .top-row { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 22px; }
  .greeting { font-size: 26px; font-weight: 800; color: var(--text); letter-spacing: -.02em; line-height: 1.1; }
  .greeting span { color: #C07090; }
  .top-sub { font-size: 13px; color: var(--muted); margin-top: 5px; font-weight: 400; }
  .top-meta { text-align: right; }
  .meta-date { font-size: 13px; font-weight: 600; color: var(--muted); }
  .meta-status { display: flex; align-items: center; gap: 5px; justify-content: flex-end; margin-top: 4px; font-size: 11px; color: var(--muted); font-weight: 500; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #80C870; flex-shrink: 0; }

  /* STAT CARDS */
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 18px; }
  .stat-card { border-radius: var(--radius); padding: 18px 18px 16px; position: relative; overflow: hidden; }
  .stat-card.yellow { background: var(--yellow); }
  .stat-card.pink { background: var(--pink); }
  .stat-card.sage { background: var(--sage); }
  .stat-label { font-size: 11px; font-weight: 600; color: rgba(30,28,24,.5); letter-spacing: .04em; text-transform: uppercase; margin-bottom: 8px; }
  .stat-number { font-size: 34px; font-weight: 800; color: var(--text); line-height: 1; letter-spacing: -.02em; }
  .stat-sub { font-size: 11px; font-weight: 500; color: rgba(30,28,24,.45); margin-top: 4px; }
  .stat-icon { position: absolute; bottom: 12px; right: 14px; font-size: 28px; opacity: .2; }

  /* PANEL */
  .panel { background: var(--card); border-radius: var(--radius); overflow: hidden; box-shadow: 0 2px 12px rgba(30,28,24,.07); margin-bottom: 14px; }
  .panel-head { padding: 14px 18px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .panel-title { font-size: 14px; font-weight: 700; color: var(--text); }
  .panel-actions { display: flex; gap: 6px; align-items: center; }
  .panel-btn { font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer; border: 1px solid var(--border); background: transparent; padding: 4px 10px; border-radius: 20px; font-family: var(--font); transition: all .15s; }
  .panel-btn:hover { border-color: var(--text); color: var(--text); }
  .panel-btn.active { background: var(--sidebar); color: #fff; border-color: var(--sidebar); }
  .panel-body { padding: 14px 18px 16px; }

  /* ADD ROW */
  .add-row { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; background: var(--bg); padding: 8px; border-radius: 12px; }
  .task-inp { flex: 1; background: transparent; border: none; padding: 6px 8px; font-family: var(--font); font-size: 13px; color: var(--text); outline: none; }
  .task-inp::placeholder { color: var(--muted); }
  .pri-sel { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; font-family: var(--font); font-size: 11px; color: var(--text); outline: none; cursor: pointer; }
  .add-btn { width: 30px; height: 30px; border-radius: 8px; border: none; background: var(--sidebar); color: var(--yellow); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform .12s; font-weight: 300; line-height: 1; }
  .add-btn:hover { transform: scale(1.08); }
  .add-btn:active { transform: scale(.95); }
  .add-btn:disabled { opacity: .4; cursor: not-allowed; }

  /* TASK LIST */
  .task-list { display: flex; flex-direction: column; gap: 5px; max-height: 400px; overflow-y: auto; }
  .task-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 11px; background: var(--bg); transition: background .15s; animation: fadeUp .15s ease-out; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
  .task-row:hover { background: #EDE7DC; }
  .task-cb { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid rgba(30,28,24,.25); background: #fff; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all .2s; }
  .task-cb.done { background: var(--sage); border-color: var(--sage); }
  .task-cb.done::after { content: ''; width: 4px; height: 8px; border-right: 2px solid var(--sidebar); border-bottom: 2px solid var(--sidebar); transform: rotate(45deg) translate(-1px,-1px); display: block; }
  .task-cb.busy { opacity: .5; }
  .task-lbl { flex: 1; font-size: 13px; font-weight: 500; color: var(--text); cursor: pointer; line-height: 1.4; min-width: 0; }
  .task-lbl.done { text-decoration: line-through; color: var(--muted); }
  .task-notes { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .task-date { font-size: 10px; color: var(--muted); margin-top: 2px; opacity: .8; }
  .tag { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 20px; flex-shrink: 0; white-space: nowrap; }
  .tag-today { background: #FFE8E0; color: #C04040; }
  .tag-week  { background: #FFF4D0; color: #906820; }
  .tag-done  { background: #E0F4E0; color: #407040; }
  .tag-prog  { background: #E8E0F4; color: #6848A0; }
  .tag-todo  { background: #F0ECE4; color: rgba(30,28,24,.5); }
  .tag-back  { background: #F5F0E8; color: rgba(30,28,24,.35); }

  /* PROGRESS */
  .prog-section { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
  .prog-top { display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .prog-track { height: 6px; background: var(--bg); border-radius: 10px; overflow: hidden; }
  .prog-fill { height: 100%; background: var(--sage); border-radius: 10px; transition: width .4s ease; }

  /* EMPTY / LOADING */
  .empty { text-align: center; padding: 20px 0; font-size: 13px; color: var(--muted); }
  .loading { text-align: center; padding: 24px 0; font-size: 13px; color: var(--muted); }

  /* STATUS BAR */
  .sbar { border-radius: 10px; padding: 8px 14px; margin-bottom: 12px; font-size: 12px; font-weight: 500; display: flex; align-items: center; }
  .sbar-ok   { background: rgba(122,140,110,.15); color: #607850; }
  .sbar-err  { background: rgba(192,83,58,.12);   color: #C04040; }
  .sbar-info { background: rgba(192,120,48,.12);  color: #A07020; }

  /* WEEK STRIP */
  .week-strip { display: flex; gap: 4px; margin-bottom: 16px; }
  .wday { flex: 1; text-align: center; padding: 7px 4px; border-radius: 10px; cursor: pointer; transition: background .15s; border: 1.5px solid transparent; }
  .wday:hover { background: rgba(30,28,24,.05); }
  .wday.today { background: var(--sidebar); border-color: var(--sidebar); }
  .wday .wd-label { font-size: 9px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .wday.today .wd-label { color: rgba(255,255,255,.5); }
  .wday .wd-num { font-size: 14px; font-weight: 700; color: var(--text); margin-top: 2px; }
  .wday.today .wd-num { color: #fff; }
  .wday.sel { border-color: var(--sage); background: rgba(168,200,120,.12); }
  .wday.today.sel { border-color: var(--sidebar); background: var(--sidebar); }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: rgba(30,28,24,.12); border-radius: 4px; }
</style>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="brand">
      <div class="brand-name">PPC</div>
      <div class="brand-sub">Platinum Premier</div>
    </div>
    <div class="nav-sec">Dashboard</div>
    <div class="nav-item active" data-panel="tasks">
      <span class="nav-icon">◈</span> Task Planner
      <span class="nav-badge" id="pendingBadge">-</span>
    </div>
    <div class="nav-item disabled" style="opacity:.35;cursor:default">
      <span class="nav-icon">◎</span> Daily Recap
    </div>
    <div class="nav-item disabled" style="opacity:.35;cursor:default">
      <span class="nav-icon">≡</span> Project Tasks
    </div>
    <div class="nav-item disabled" style="opacity:.35;cursor:default">
      <span class="nav-icon">◻</span> Quick Notes
    </div>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="avatar">R</div>
        <div><div class="user-name">Rae</div><div class="user-role">EA · Operations</div></div>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="top-row">
      <div>
        <div class="greeting" id="greeting">Good morning, <span>Rae.</span></div>
        <div class="top-sub" id="topSub">Loading your tasks…</div>
      </div>
      <div class="top-meta">
        <div class="meta-date" id="metaDate"></div>
        <div class="meta-status"><div class="status-dot" id="syncDot"></div> <span id="syncLabel">syncing</span></div>
      </div>
    </div>

    <div id="statusBar" style="display:none"></div>

    <!-- WEEK STRIP -->
    <div class="week-strip" id="weekStrip"></div>

    <!-- STAT CARDS -->
    <div class="stat-grid">
      <div class="stat-card yellow">
        <div class="stat-label">Today's Tasks</div>
        <div class="stat-number" id="sTotal">-</div>
        <div class="stat-sub" id="sTotalSub">loading</div>
        <div class="stat-icon">📋</div>
      </div>
      <div class="stat-card pink">
        <div class="stat-label">Completed</div>
        <div class="stat-number" id="sDone">-</div>
        <div class="stat-sub" id="sDoneSub">loading</div>
        <div class="stat-icon">✓</div>
      </div>
      <div class="stat-card sage">
        <div class="stat-label">Priority Today</div>
        <div class="stat-number" id="sPri">-</div>
        <div class="stat-sub">needs attention</div>
        <div class="stat-icon">⚡</div>
      </div>
    </div>

    <!-- TASK PANEL -->
    <div class="panel">
      <div class="panel-head">
        <div class="panel-title">Task Planner</div>
        <div class="panel-actions">
          <button class="panel-btn active" id="btnToday" onclick="setFilter('today')">Today</button>
          <button class="panel-btn" id="btnAll" onclick="setFilter('all')">All</button>
          <button class="panel-btn" onclick="loadTasks()" title="Refresh">↻ Sync</button>
        </div>
      </div>
      <div class="panel-body">
        <div class="add-row">
          <input class="task-inp" id="taskInput" type="text" placeholder="Add a task…" maxlength="200">
          <select class="pri-sel" id="priSel">
            <option value="">No priority</option>
            <option value="Priority today">🔴 Priority today</option>
            <option value="Priority this week">🟡 This week</option>
          </select>
          <button class="add-btn" id="addBtn" onclick="addTask()">+</button>
        </div>
        <div class="task-list" id="taskList"><div class="loading">Loading from Notion…</div></div>
        <div class="prog-section" id="progSec" style="display:none">
          <div class="prog-top"><span>Progress</span><span id="progLabel">0%</span></div>
          <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
const W = 'https://ppc-taskplanner.rachel-f0b.workers.dev';
const DB_TASKS = '30634595b2aa807fbe6aeddda8aa124a';

let allTasks = [];
let filterMode = 'today';
let selectedDate = toYMD(new Date());

function toYMD(d) { return d.toISOString().split('T')[0]; }
function displayDate(ymd) {
  if (!ymd) return '';
  const t = toYMD(new Date()), y = toYMD(new Date(Date.now()-864e5));
  if (ymd===t) return 'Today';
  if (ymd===y) return 'Yesterday';
  return new Date(ymd+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// DATE + GREETING
function initUI() {
  const n = new Date(), h = n.getHours();
  const g = h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  document.getElementById('greeting').innerHTML = `${g}, <span>Rae.</span>`;
  const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const mos=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('metaDate').textContent = `${days[n.getDay()]}, ${mos[n.getMonth()]} ${n.getDate()}`;
  buildWeek(n);
}

function buildWeek(now) {
  const strip = document.getElementById('weekStrip');
  const dns = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  const start = new Date(now); start.setDate(now.getDate()-now.getDay());
  const todayYMD = toYMD(now);
  strip.innerHTML = '';
  for (let i=0;i<7;i++) {
    const d = new Date(start); d.setDate(start.getDate()+i);
    const ymd = toYMD(d);
    const isToday = ymd === todayYMD;
    const isSel = ymd === selectedDate;
    const chip = document.createElement('div');
    chip.className = 'wday' + (isToday?' today':'') + (isSel&&!isToday?' sel':'');
    chip.innerHTML = `<div class="wd-label">${dns[i]}</div><div class="wd-num">${d.getDate()}</div>`;
    chip.onclick = () => { selectedDate=ymd; buildWeek(now); renderTasks(); };
    strip.appendChild(chip);
  }
}

// STATUS
function showStatus(msg, type) {
  const bar = document.getElementById('statusBar');
  bar.className = 'sbar sbar-'+type;
  bar.textContent = msg;
  bar.style.display = 'flex';
  if (type!=='err') setTimeout(()=>bar.style.display='none', 3000);
}

function setSynced(ok) {
  document.getElementById('syncDot').style.background = ok?'#80C870':'#E08060';
  document.getElementById('syncLabel').textContent = ok?'synced':'offline';
}

// API
async function notionQuery(dbId, body={}) {
  const res = await fetch(`${W}/query/${dbId}`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  return res.json();
}

async function notionCreate(body) {
  const res = await fetch(`${W}/pages`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  return res.json();
}

async function notionUpdate(pageId, body) {
  const res = await fetch(`${W}/pages/${pageId.replaceAll('-','')}`, {
    method:'PATCH', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  return res.json();
}

// PARSE
function parseTask(p) {
  const pr = p.properties||{};
  return {
    id: p.id,
    title: pr['Task']?.title?.[0]?.plain_text||'Untitled',
    status: pr['Status']?.status?.name||'Not started',
    priority: pr['Priority Type']?.select?.name||'',
    doDate: pr['Do Date']?.date?.start||null,
    dueDate: pr['Due Date']?.date?.start||null,
    notes: pr['Notes']?.rich_text?.[0]?.plain_text||'',
  };
}

// LOAD
async function loadTasks() {
  showStatus('Syncing with Notion…','info');
  try {
    const data = await notionQuery(DB_TASKS, { page_size: 100 });
    allTasks = (data.results||[]).map(parseTask);
    renderTasks();
    setSynced(true);
    showStatus('Synced ✓','ok');
    document.getElementById('topSub').textContent = `${allTasks.length} tasks total · Let's make today count.`;
  } catch(e) {
    showStatus('Could not reach Notion.','err');
    setSynced(false);
    document.getElementById('taskList').innerHTML = '<div class="empty">Could not load tasks ☕</div>';
  }
}

// FILTER
function setFilter(mode) {
  filterMode = mode;
  document.getElementById('btnToday').classList.toggle('active', mode==='today');
  document.getElementById('btnAll').classList.toggle('active', mode==='all');
  renderTasks();
}

// RENDER
function renderTasks() {
  const list = document.getElementById('taskList');
  const progSec = document.getElementById('progSec');

  let tasks = allTasks;
  if (filterMode==='today') tasks = allTasks.filter(t=>t.doDate===selectedDate);

  const pending = tasks.filter(t=>t.status!=='Done');
  const done = tasks.filter(t=>t.status==='Done');
  const allFiltered = [...pending, ...done];

  // Stats
  const todayTasks = allTasks.filter(t=>t.doDate===toYMD(new Date()));
  const todayDone = todayTasks.filter(t=>t.status==='Done');
  const todayPri = allTasks.filter(t=>t.priority==='Priority today'&&t.status!=='Done');
  const allPending = allTasks.filter(t=>t.status!=='Done');

  document.getElementById('sTotal').textContent = todayTasks.length;
  document.getElementById('sTotalSub').textContent = todayTasks.length===0?'nothing scheduled':`${todayTasks.filter(t=>t.status!=='Done').length} remaining`;
  document.getElementById('sDone').textContent = todayDone.length;
  document.getElementById('sDoneSub').textContent = todayDone.length===todayTasks.length&&todayTasks.length>0?'all done! 🎉':`of ${todayTasks.length} tasks`;
  document.getElementById('sPri').textContent = todayPri.length;
  document.getElementById('pendingBadge').textContent = allPending.length;

  if (!allFiltered.length) {
    list.innerHTML = `<div class="empty">No tasks ${filterMode==='today'?'for '+displayDate(selectedDate):''} ☕</div>`;
    progSec.style.display = 'none'; return;
  }

  progSec.style.display = 'block';
  const pct = allFiltered.length ? Math.round(done.length/allFiltered.length*100) : 0;
  document.getElementById('progFill').style.width = pct+'%';
  document.getElementById('progLabel').textContent = pct+'%';

  list.innerHTML = allFiltered.map(t => {
    const isDone = t.status==='Done';
    const priTag = t.priority==='Priority today'?'<span class="tag tag-today">Today</span>':
                   t.priority==='Priority this week'?'<span class="tag tag-week">This week</span>':'';
    const statusTag = isDone?'<span class="tag tag-done">Done</span>':
                      t.status==='In progress'?'<span class="tag tag-prog">In progress</span>':
                      t.status==='Backlog'?'<span class="tag tag-back">Backlog</span>':
                      '<span class="tag tag-todo">To do</span>';
    const dateInfo = filterMode==='all'&&t.doDate ? `<div class="task-date">${displayDate(t.doDate)}</div>` : '';
    const notesInfo = t.notes ? `<div class="task-notes">${esc(t.notes)}</div>` : '';

    return `<div class="task-row">
      <div class="task-cb ${isDone?'done':''}" data-id="${t.id}" data-done="${isDone}" onclick="handleCheck(this)"></div>
      <div style="flex:1;min-width:0">
        <div class="task-lbl ${isDone?'done':''}">${esc(t.title)}</div>
        ${notesInfo}${dateInfo}
      </div>
      <div style="display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end">
        ${priTag}${statusTag}
      </div>
    </div>`;
  }).join('');
}

// ADD
async function addTask() {
  const inp = document.getElementById('taskInput');
  const pri = document.getElementById('priSel').value;
  const title = inp.value.trim();
  if (!title) return;

  const btn = document.getElementById('addBtn');
  btn.disabled=true; btn.textContent='…';
  showStatus('Adding task…','info');

  const props = {
    'Task': { title: [{ text: { content: title } }] },
    'Status': { status: { name: 'Not started' } },
    'Do Date': { date: { start: selectedDate } },
  };
  if (pri) props['Priority Type'] = { select: { name: pri } };

  try {
    const data = await notionCreate({ parent: { database_id: DB_TASKS }, properties: props });
    if (data.object==='error') throw new Error(data.message);
    inp.value = '';
    showStatus('Task added ✓','ok');
    await loadTasks();
  } catch(e) {
    showStatus('Could not add: '+e.message,'err');
  }
  btn.disabled=false; btn.textContent='+';
}

// COMPLETE
async function handleCheck(el) {
  if (el.dataset.done==='true'||el.classList.contains('busy')) return;
  el.classList.add('busy');
  showStatus('Marking done…','info');
  try {
    const data = await notionUpdate(el.dataset.id, { properties: { 'Status': { status: { name: 'Done' } } } });
    if (data.object==='error') throw new Error(data.message);
    showStatus('Done ✓','ok');
    await loadTasks();
  } catch(e) {
    showStatus('Could not update: '+e.message,'err');
    el.classList.remove('busy');
  }
}

// KEY
document.getElementById('taskInput').addEventListener('keydown', e => {
  if (e.key==='Enter') { e.preventDefault(); addTask(); }
});

// INIT
initUI();
loadTasks();
</script>
</body>
</html>
