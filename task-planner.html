<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F5EFE4;--card:#fff;--yellow:#F5D060;--pink:#F0A0B4;--sage:#A8C878;--text:#1E1C18;--side:#1E1C18;--muted:rgba(30,28,24,.45);--bdr:rgba(30,28,24,.1);--r:16px;--f:'Outfit',sans-serif}
body{background:var(--bg);font-family:var(--f);color:var(--text);padding:20px 18px 32px;min-height:100vh}
.wrap{max-width:720px;margin:0 auto}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--bdr)}
.hdr-t{font-size:22px;font-weight:800;letter-spacing:-.02em}.hdr-t span{color:#C07090}
.hdr-sub{font-size:12px;color:var(--muted);margin-top:3px}
.hdr-r{text-align:right}.hdr-date{font-size:12px;font-weight:600;color:var(--muted)}
.sync{font-size:11px;font-weight:600;color:var(--muted);background:transparent;border:1px solid var(--bdr);border-radius:8px;padding:4px 10px;cursor:pointer;font-family:var(--f);margin-top:4px;transition:all .15s}.sync:hover{border-color:var(--text);color:var(--text)}
.sb{border-radius:10px;padding:8px 14px;margin-bottom:12px;font-size:12px;font-weight:500;display:flex;align-items:center}
.sb-ok{background:rgba(122,140,110,.15);color:#607850}.sb-err{background:rgba(192,83,58,.12);color:#C04040}.sb-info{background:rgba(192,120,48,.12);color:#A07020}
.ws{display:flex;gap:4px;margin-bottom:16px}
.wd{flex:1;text-align:center;padding:7px 4px;border-radius:10px;cursor:pointer;transition:background .15s;border:1.5px solid transparent}
.wd:hover{background:rgba(30,28,24,.05)}.wd.td{background:var(--side);border-color:var(--side)}.wd .wl{font-size:9px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.wd.td .wl{color:rgba(255,255,255,.5)}.wd .wn{font-size:14px;font-weight:700;color:var(--text);margin-top:2px}.wd.td .wn{color:#fff}.wd.sl{border-color:var(--sage);background:rgba(168,200,120,.12)}.wd.td.sl{border-color:var(--side);background:var(--side)}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.sc{border-radius:var(--r);padding:16px;position:relative;overflow:hidden}.sc.yl{background:var(--yellow)}.sc.pk{background:var(--pink)}.sc.sg2{background:var(--sage)}
.sl{font-size:10px;font-weight:600;color:rgba(30,28,24,.5);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.sn{font-size:30px;font-weight:800;line-height:1;letter-spacing:-.02em}.ss{font-size:10px;font-weight:500;color:rgba(30,28,24,.45);margin-top:3px}.si{position:absolute;bottom:10px;right:12px;font-size:22px;opacity:.2}
.pn{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 2px 12px rgba(30,28,24,.07)}
.ph{padding:12px 16px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between}
.pt{font-size:14px;font-weight:700}.pa{display:flex;gap:6px}
.pb{font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;border:1px solid var(--bdr);background:transparent;padding:4px 10px;border-radius:20px;font-family:var(--f);transition:all .15s}.pb:hover{border-color:var(--text);color:var(--text)}.pb.act{background:var(--side);color:#fff;border-color:var(--side)}
.pd{padding:14px 16px}
.ar{display:flex;gap:8px;align-items:center;margin-bottom:14px;background:var(--bg);padding:8px;border-radius:12px}
.ip{flex:1;background:transparent;border:none;padding:6px 8px;font-family:var(--f);font-size:13px;color:var(--text);outline:none}.ip::placeholder{color:var(--muted)}
.se{background:#fff;border:1px solid var(--bdr);border-radius:8px;padding:6px 8px;font-family:var(--f);font-size:11px;color:var(--text);outline:none;cursor:pointer;max-width:140px}
.ab{width:30px;height:30px;border-radius:8px;border:none;background:var(--side);color:var(--yellow);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .12s;line-height:1}.ab:hover{transform:scale(1.08)}.ab:disabled{opacity:.4;cursor:not-allowed}
.tl{display:flex;flex-direction:column;gap:5px;max-height:500px;overflow-y:auto}
.tw{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;background:var(--bg);transition:background .15s;animation:fu .15s ease-out}
@keyframes fu{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.tw:hover{background:#EDE7DC}
.cb{width:18px;height:18px;border-radius:5px;border:1.5px solid rgba(30,28,24,.25);background:#fff;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
.cb.dn{background:var(--sage);border-color:var(--sage)}.cb.dn::after{content:'';width:4px;height:8px;border-right:2px solid var(--side);border-bottom:2px solid var(--side);transform:rotate(45deg) translate(-1px,-1px);display:block}.cb.bz{opacity:.5}
.tx{flex:1;font-size:13px;font-weight:500;cursor:pointer;line-height:1.4;min-width:0}.tx.dn{text-decoration:line-through;color:var(--muted)}
.tn{font-size:11px;color:var(--muted);margin-top:2px}
.tg{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;flex-shrink:0;white-space:nowrap}
.tg-t{background:#FFE8E0;color:#C04040}.tg-w{background:#FFF4D0;color:#906820}.tg-d{background:#E0F4E0;color:#407040}.tg-p{background:#E8E0F4;color:#6848A0}.tg-o{background:#F0ECE4;color:rgba(30,28,24,.5)}.tg-b{background:#F5F0E8;color:rgba(30,28,24,.35)}
.tags{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.ps{margin-top:14px;padding-top:12px;border-top:1px solid var(--bdr)}.pst{display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px}.ptr{height:6px;background:var(--bg);border-radius:10px;overflow:hidden}.pfl{height:100%;background:var(--sage);border-radius:10px;transition:width .4s ease}
.em{text-align:center;padding:20px 0;font-size:13px;color:var(--muted)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:rgba(30,28,24,.12);border-radius:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div><div class="hdr-t">◈ Task <span>Planner</span></div><div class="hdr-sub" id="topSub">Loading…</div></div>
    <div class="hdr-r"><div class="hdr-date" id="metaDate"></div><button class="sync" onclick="load()">↻ Sync</button></div>
  </div>
  <div id="sBar" style="display:none"></div>
  <div class="ws" id="weekStrip"></div>
  <div class="sg">
    <div class="sc yl"><div class="sl">Today's Tasks</div><div class="sn" id="s1">-</div><div class="ss" id="s1s">loading</div><div class="si">📋</div></div>
    <div class="sc pk"><div class="sl">Completed</div><div class="sn" id="s2">-</div><div class="ss" id="s2s">loading</div><div class="si">✓</div></div>
    <div class="sc sg2"><div class="sl">Priority Today</div><div class="sn" id="s3">-</div><div class="ss">needs attention</div><div class="si">⚡</div></div>
  </div>
  <div class="pn"><div class="ph"><div class="pt">Tasks</div><div class="pa">
    <button class="pb act" id="bT" onclick="sf('today')">Today</button><button class="pb" id="bA" onclick="sf('all')">All</button>
  </div></div><div class="pd">
    <div class="ar"><input class="ip" id="tInp" placeholder="Add a task…" maxlength="200"><select class="se" id="tPri"><option value="">No priority</option><option value="Priority today">🔴 Today</option><option value="Priority this week">🟡 Week</option></select><button class="ab" id="tBtn" onclick="add()">+</button></div>
    <div class="tl" id="list"><div class="em">Loading…</div></div>
    <div class="ps" id="prog" style="display:none"><div class="pst"><span>Progress</span><span id="pL">0%</span></div><div class="ptr"><div class="pfl" id="pF" style="width:0%"></div></div></div>
  </div></div>
</div>
<script>
const W='https://ppc-taskplanner.rachel-f0b.workers.dev',DB='30634595b2aa807fbe6aeddda8aa124a';
let all=[],fm='today',sel=toYMD(new Date());
function toYMD(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dD(y){if(!y)return'';const t=toYMD(new Date()),x=toYMD(new Date(Date.now()-864e5));if(y===t)return'Today';if(y===x)return'Yesterday';return new Date(y+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function ss(m,t){const b=document.getElementById('sBar');b.className='sb sb-'+t;b.textContent=m;b.style.display='flex';if(t!=='err')setTimeout(()=>b.style.display='none',3000)}
function initUI(){const n=new Date(),h=n.getHours(),g=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
const ds=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],ms=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
document.getElementById('metaDate').textContent=`${ds[n.getDay()]}, ${ms[n.getMonth()]} ${n.getDate()}`;bw(n)}
function bw(now){const s=document.getElementById('weekStrip'),dn=['Su','Mo','Tu','We','Th','Fr','Sa'],st=new Date(now);st.setDate(now.getDate()-now.getDay());const ty=toYMD(now);s.innerHTML='';
for(let i=0;i<7;i++){const d=new Date(st);d.setDate(st.getDate()+i);const y=toYMD(d),isT=y===ty,isS=y===sel;const c=document.createElement('div');c.className='wd'+(isT?' td':'')+(isS&&!isT?' sl':'');c.innerHTML=`<div class="wl">${dn[i]}</div><div class="wn">${d.getDate()}</div>`;c.onclick=()=>{sel=y;bw(now);render()};s.appendChild(c)}}
function parse(p){const r=p.properties||{};return{id:p.id,title:r['Task']?.title?.[0]?.plain_text||'Untitled',status:r['Status']?.status?.name||'Not started',priority:r['Priority Type']?.select?.name||'',doDate:r['Do Date']?.date?.start||null,notes:r['Notes']?.rich_text?.[0]?.plain_text||''}}
async function load(){ss('Syncing…','info');try{const r=await fetch(`${W}/query/${DB}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({page_size:100})});const d=await r.json();all=(d.results||[]).map(parse);render();ss('Synced ✓','ok');document.getElementById('topSub').textContent=`${all.length} tasks total`}catch(e){ss('Could not reach Notion.','err')}}
function sf(m){fm=m;document.getElementById('bT').classList.toggle('act',m==='today');document.getElementById('bA').classList.toggle('act',m==='all');render()}
function render(){const ls=document.getElementById('list'),ps=document.getElementById('prog');let t=all;if(fm==='today')t=all.filter(x=>x.doDate===sel);
const p=t.filter(x=>x.status!=='Done'),d=t.filter(x=>x.status==='Done'),a=[...p,...d];
const tdy=all.filter(x=>x.doDate===toYMD(new Date())),tdD=tdy.filter(x=>x.status==='Done'),tdP=all.filter(x=>x.priority==='Priority today'&&x.status!=='Done');
document.getElementById('s1').textContent=tdy.length;document.getElementById('s1s').textContent=tdy.length?`${tdy.length-tdD.length} remaining`:'none';
document.getElementById('s2').textContent=tdD.length;document.getElementById('s2s').textContent=tdD.length===tdy.length&&tdy.length?'all done! 🎉':`of ${tdy.length}`;
document.getElementById('s3').textContent=tdP.length;
if(!a.length){ls.innerHTML=`<div class="em">No tasks ${fm==='today'?'for '+dD(sel):''} ☕</div>`;ps.style.display='none';return}
ps.style.display='block';const pct=Math.round(d.length/a.length*100);document.getElementById('pF').style.width=pct+'%';document.getElementById('pL').textContent=pct+'%';
ls.innerHTML=a.map(x=>{const dn=x.status==='Done',pt=x.priority==='Priority today'?'<span class="tg tg-t">Today</span>':x.priority==='Priority this week'?'<span class="tg tg-w">Week</span>':'';
const st=dn?'<span class="tg tg-d">Done</span>':x.status==='In progress'?'<span class="tg tg-p">In progress</span>':x.status==='Backlog'?'<span class="tg tg-b">Backlog</span>':'<span class="tg tg-o">To do</span>';
const di=fm==='all'&&x.doDate?`<div class="tn">${dD(x.doDate)}</div>`:'';const ni=x.notes?`<div class="tn">${esc(x.notes)}</div>`:'';
return `<div class="tw"><div class="cb ${dn?'dn':''}" data-id="${x.id}" data-done="${dn}" onclick="chk(this)"></div><div style="flex:1;min-width:0"><div class="tx ${dn?'dn':''}">${esc(x.title)}</div>${ni}${di}</div><div class="tags">${pt}${st}</div></div>`}).join('')}
async function add(){const i=document.getElementById('tInp'),p=document.getElementById('tPri').value,t=i.value.trim();if(!t)return;
const b=document.getElementById('tBtn');b.disabled=true;b.textContent='…';ss('Adding…','info');
const pr={'Task':{title:[{text:{content:t}}]},'Status':{status:{name:'Not started'}},'Do Date':{date:{start:sel}}};if(p)pr['Priority Type']={select:{name:p}};
try{const r=await fetch(`${W}/pages`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({parent:{database_id:DB},properties:pr})});const d=await r.json();if(d.object==='error')throw new Error(d.message);i.value='';ss('Added ✓','ok');await load()}catch(e){ss('Error: '+e.message,'err')}b.disabled=false;b.textContent='+'}
async function chk(el){if(el.dataset.done==='true'||el.classList.contains('bz'))return;el.classList.add('bz');ss('Updating…','info');
try{const r=await fetch(`${W}/pages/${el.dataset.id.replaceAll('-','')}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({properties:{'Status':{status:{name:'Done'}}}})});const d=await r.json();if(d.object==='error')throw new Error(d.message);ss('Done ✓','ok');await load()}catch(e){ss('Error','err');el.classList.remove('bz')}}
document.getElementById('tInp').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add()}});
initUI();load();
</script>
</body>
</html>
