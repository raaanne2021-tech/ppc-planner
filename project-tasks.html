<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Tasks</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5EFE4;--card:#fff;--yellow:#F5D060;--pink:#F0A0B4;--sage:#A8C878;--lav:#C0A8E0;
  --text:#1E1C18;--side:#1E1C18;--muted:rgba(30,28,24,.45);--bdr:rgba(30,28,24,.1);
  --r:14px;--f:'Outfit',sans-serif;
}
body{background:var(--bg);font-family:var(--f);color:var(--text);padding:18px 20px 32px;min-height:100vh}

/* HEADER */
.hdr{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;padding-bottom:13px;border-bottom:1px solid var(--bdr)}
.gr{font-size:23px;font-weight:800;letter-spacing:-.02em}.gr span{color:#C07090}
.hdr-sub{font-size:11px;color:var(--muted);margin-top:4px}
.hdr-r{display:flex;align-items:center;gap:10px}
.hdr-date{font-size:12px;font-weight:600;color:var(--muted)}
.sync-btn{font-size:11px;font-weight:600;color:var(--muted);background:transparent;border:1px solid var(--bdr);border-radius:8px;padding:5px 12px;cursor:pointer;font-family:var(--f);transition:all .15s}.sync-btn:hover{border-color:var(--text);color:var(--text)}

/* STATUS */
.sb{border-radius:10px;padding:7px 14px;margin-bottom:12px;font-size:12px;font-weight:500;display:flex;align-items:center}
.sb-ok{background:rgba(122,140,110,.15);color:#607850}.sb-err{background:rgba(192,83,58,.12);color:#C04040}.sb-info{background:rgba(192,120,48,.12);color:#A07020}

/* STAT CARDS */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.sc{border-radius:var(--r);padding:16px 18px 14px;position:relative;overflow:hidden}
.sc.yl{background:var(--yellow)}.sc.pk{background:var(--pink)}.sc.sg{background:var(--sage)}.sc.lv{background:var(--lav)}
.sc-num{font-size:10px;font-weight:700;color:rgba(30,28,24,.4);letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px}
.sc-val{font-size:36px;font-weight:800;color:var(--text);line-height:1;letter-spacing:-.02em}
.sc-sub{font-size:11px;font-weight:500;color:rgba(30,28,24,.45);margin-top:4px}
.sc-icon{position:absolute;bottom:10px;right:14px;font-size:26px;opacity:.18}

/* PANEL */
.pn{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 2px 10px rgba(30,28,24,.07)}
.ph{padding:12px 16px 11px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between}
.pt{font-size:14px;font-weight:700}
.pa{display:flex;gap:5px;align-items:center}
.pb{font-size:10px;font-weight:600;color:var(--muted);cursor:pointer;border:1px solid var(--bdr);background:transparent;padding:3px 9px;border-radius:14px;font-family:var(--f);transition:all .15s}.pb:hover{border-color:var(--text);color:var(--text)}.pb.act{background:var(--side);color:#fff;border-color:var(--side)}

/* PROJECT PANEL SPLIT */
.proj-split{display:grid;grid-template-columns:240px 1fr;min-height:400px}

/* SIDEBAR */
.proj-sidebar{border-right:1px solid var(--bdr);padding:12px 10px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;max-height:600px}
.sidebar-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:4px 10px 8px;border-bottom:1px solid var(--bdr);margin-bottom:4px}
.proj-item{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:all .15s;border:1.5px solid transparent}
.proj-item:hover{background:var(--bg)}.proj-item.active{background:var(--side);border-color:var(--side)}
.proj-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-ip{background:var(--sage)}.dot-ns{background:var(--yellow)}.dot-bl{background:rgba(30,28,24,.15)}
.proj-info{flex:1;min-width:0}
.proj-name{font-size:12.5px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
.proj-item.active .proj-name{color:#fff}
.proj-status{font-size:10px;color:var(--muted);margin-top:1px}
.proj-item.active .proj-status{color:rgba(255,255,255,.5)}
.proj-badge{font-size:10px;font-weight:700;color:var(--muted);background:rgba(30,28,24,.08);padding:2px 8px;border-radius:10px;flex-shrink:0}
.proj-item.active .proj-badge{background:rgba(255,255,255,.15);color:rgba(255,255,255,.7)}

/* CONTENT AREA */
.proj-content{display:flex;flex-direction:column;min-height:400px}
.proj-content-hdr{padding:14px 18px 12px;border-bottom:1px solid var(--bdr);display:flex;align-items:flex-end;justify-content:space-between}
.proj-content-title{font-size:16px;font-weight:800;letter-spacing:-.01em}
.proj-content-meta{font-size:11px;color:var(--muted);margin-top:3px}
.proj-progress{margin-top:8px}
.prog-track{height:4px;background:var(--bg);border-radius:10px;overflow:hidden;width:120px}
.prog-fill{height:100%;background:var(--sage);border-radius:10px;transition:width .4s ease}
.prog-label{font-size:10px;font-weight:600;color:var(--muted);margin-top:4px}

.proj-body{padding:14px 18px;flex:1}

/* ADD ROW */
.ar{display:flex;gap:7px;align-items:center;margin-bottom:14px;background:var(--bg);padding:7px 10px;border-radius:11px}
.ip{flex:1;background:transparent;border:none;padding:6px 7px;font-family:var(--f);font-size:13px;color:var(--text);outline:none}.ip::placeholder{color:var(--muted)}
.se{background:#fff;border:1px solid var(--bdr);border-radius:7px;padding:6px 8px;font-family:var(--f);font-size:11px;color:var(--text);outline:none;cursor:pointer}
.ab{width:28px;height:28px;border-radius:8px;border:none;background:var(--side);color:var(--yellow);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1;transition:transform .12s}.ab:hover{transform:scale(1.08)}.ab:disabled{opacity:.4;cursor:not-allowed}

/* TASK LIST */
.tl{display:flex;flex-direction:column;gap:5px;max-height:460px;overflow-y:auto}
.tw{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:var(--bg);transition:background .15s;animation:fu .15s ease-out}
@keyframes fu{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
.tw:hover{background:#EDE7DC}
.cb{width:17px;height:17px;border-radius:5px;border:1.5px solid rgba(30,28,24,.2);background:#fff;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
.cb.dn{background:var(--sage);border-color:var(--sage)}.cb.dn::after{content:'';width:4px;height:8px;border-right:2px solid var(--side);border-bottom:2px solid var(--side);transform:rotate(45deg) translate(-1px,-1px);display:block}.cb.bz{opacity:.5}
.tx{flex:1;font-size:13px;font-weight:500;cursor:pointer;line-height:1.4;min-width:0}.tx.dn{text-decoration:line-through;color:var(--muted)}
.tn{font-size:11px;color:var(--muted);margin-top:2px}
.tg{font-size:9px;font-weight:700;padding:2px 7px;border-radius:12px;flex-shrink:0;white-space:nowrap}
.tg-t{background:#FFE8E0;color:#C04040}.tg-w{background:#FFF4D0;color:#906820}
.tg-d{background:#E0F4E0;color:#407040}.tg-ip{background:#E8E0F4;color:#6848A0}
.tg-o{background:#F0ECE4;color:rgba(30,28,24,.45)}
.tags{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}

.section-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px 0 6px;margin-top:4px}
.empty{text-align:center;padding:48px 0;font-size:13px;color:var(--muted)}
.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:300px;gap:8px}
.placeholder-icon{font-size:36px;opacity:.25}
.placeholder-text{font-size:13px;color:var(--muted);text-align:center}

::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:rgba(30,28,24,.1);border-radius:4px}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div>
    <div class="gr">≡ Project <span>Tasks</span></div>
    <div class="hdr-sub" id="hdrSub">Loading projects…</div>
  </div>
  <div class="hdr-r">
    <div class="hdr-date" id="metaDate"></div>
    <button class="sync-btn" onclick="loadAll()">↻ Sync</button>
  </div>
</div>

<div id="sBar" style="display:none"></div>

<!-- STAT CARDS -->
<div class="stat-row">
  <div class="sc lv">
    <div class="sc-num">01 · Active Projects</div>
    <div class="sc-val" id="s1">-</div>
    <div class="sc-sub">in progress</div>
    <div class="sc-icon">🚧</div>
  </div>
  <div class="sc yl">
    <div class="sc-num">02 · Total Tasks</div>
    <div class="sc-val" id="s2">-</div>
    <div class="sc-sub" id="s2s">across all projects</div>
    <div class="sc-icon">📋</div>
  </div>
  <div class="sc pk">
    <div class="sc-num">03 · Pending</div>
    <div class="sc-val" id="s3">-</div>
    <div class="sc-sub">to complete</div>
    <div class="sc-icon">⏳</div>
  </div>
  <div class="sc sg">
    <div class="sc-num">04 · Priority Today</div>
    <div class="sc-val" id="s4">-</div>
    <div class="sc-sub">needs attention</div>
    <div class="sc-icon">⚡</div>
  </div>
</div>

<!-- MAIN PANEL -->
<div class="pn">
  <div class="ph">
    <div class="pt">Projects</div>
    <div class="pa">
      <span id="projMeta" style="font-size:11px;color:var(--muted);font-weight:500"></span>
      <button class="pb act" id="btnPending" onclick="setTaskView('pending')">Pending</button>
      <button class="pb" id="btnAll" onclick="setTaskView('all')">All</button>
    </div>
  </div>

  <div class="proj-split">

    <!-- PROJECT SIDEBAR -->
    <div class="proj-sidebar" id="projSidebar">
      <div class="sidebar-label">Select a project</div>
      <div class="empty" style="padding:20px 0;font-size:12px">Loading…</div>
    </div>

    <!-- TASK CONTENT -->
    <div class="proj-content" id="projContent">
      <div class="placeholder">
        <div class="placeholder-icon">🚧</div>
        <div class="placeholder-text">Select a project from the left<br>to see its tasks</div>
      </div>
    </div>

  </div>
</div>

<script>
const W='https://ppc-taskplanner.rachel-f0b.workers.dev';
const DB_T='30634595b2aa807fbe6aeddda8aa124a';
const DB_P='35934595b2aa8034a4eed7794f61ad8d';

let tasks=[],projects=[],projPropName=null;
let selProjId=null,taskView='pending';

function toYMD(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dD(y){if(!y)return'';const t=toYMD(new Date()),x=toYMD(new Date(Date.now()-864e5));if(y===t)return'Today';if(y===x)return'Yesterday';return new Date(y+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function showS(m,t){const b=document.getElementById('sBar');b.className='sb sb-'+t;b.textContent=m;b.style.display='flex';if(t!=='err')setTimeout(()=>b.style.display='none',3000)}

function initUI(){
  const n=new Date(),ds=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],ms=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('metaDate').textContent=`${ds[n.getDay()]}, ${ms[n.getMonth()]} ${n.getDate()}`;
}

// API
async function qry(db,body={}){const r=await fetch(`${W}/query/${db}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return r.json()}
async function crt(body){const r=await fetch(`${W}/pages`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return r.json()}
async function upd(id,body){const r=await fetch(`${W}/pages/${id.replaceAll('-','')}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return r.json()}

// Schema
async function loadSchema(){
  try{const r=await fetch(`${W}/schema/${DB_T}`);const d=await r.json();const props=d.properties||{};
    for(const[name,prop]of Object.entries(props)){if(prop.type==='relation'){projPropName=name;break;}}}catch(e){}
}

// Load all
async function loadAll(){
  showS('Syncing…','info');
  try{
    const[td,pd]=await Promise.all([
      qry(DB_T,{page_size:100}),
      qry(DB_P,{page_size:50})
    ]);
    tasks=(td.results||[]).map(p=>{const r=p.properties||{};return{id:p.id,
      title:r['Task']?.title?.[0]?.plain_text||'Untitled',
      status:r['Status']?.status?.name||'Not started',
      priority:r['Priority Type']?.select?.name||'',
      doDate:r['Do Date']?.date?.start||null,
      notes:r['Notes']?.rich_text?.[0]?.plain_text||'',
      projIds:(r['🚧 Projects ']?.relation||[]).map(x=>x.id)}});
    projects=(pd.results||[]).map(p=>({id:p.id,
      name:p.properties?.['Name']?.title?.[0]?.plain_text||'Untitled',
      status:p.properties?.['Status']?.status?.name||'Not started'}));
    updateStats();renderSidebar();
    if(selProjId)renderContent();
    showS('Synced ✓','ok');
    document.getElementById('hdrSub').textContent=`${projects.filter(p=>p.status!=='Done').length} active projects · ${tasks.length} tasks total`;
  }catch(e){showS('Could not load.','err')}
}

// Stats
function updateStats(){
  const active=projects.filter(p=>p.status!=='Done');
  const allT=tasks.filter(t=>t.projIds.length>0);
  const pending=allT.filter(t=>t.status!=='Done');
  const priT=tasks.filter(t=>t.priority==='Priority today'&&t.status!=='Done');
  document.getElementById('s1').textContent=active.filter(p=>p.status==='In progress').length;
  document.getElementById('s2').textContent=allT.length;
  document.getElementById('s2s').textContent=pending.length+' pending';
  document.getElementById('s3').textContent=pending.length;
  document.getElementById('s4').textContent=priT.length;
}

// Sidebar
function renderSidebar(){
  const sb=document.getElementById('projSidebar');
  const active=projects.filter(p=>p.status!=='Done');
  if(!active.length){sb.innerHTML='<div class="sidebar-label">Projects</div><div class="empty" style="padding:20px 0;font-size:12px">No active projects</div>';return}

  const statusOrder={'In progress':0,'Not started':1,'Backlog':2};
  active.sort((a,b)=>(statusOrder[a.status]??3)-(statusOrder[b.status]??3));

  sb.innerHTML='<div class="sidebar-label">Active Projects</div>'+active.map(p=>{
    const pTasks=tasks.filter(t=>t.projIds.some(id=>id.replaceAll('-','')=== p.id.replaceAll('-','')));
    const pending=pTasks.filter(t=>t.status!=='Done').length;
    const dotClass=p.status==='In progress'?'dot-ip':p.status==='Not started'?'dot-ns':'dot-bl';
    const isActive=selProjId===p.id;
    return `<div class="proj-item ${isActive?'active':''}" onclick="selectProject('${p.id}')">
      <div class="proj-dot ${dotClass}"></div>
      <div class="proj-info">
        <div class="proj-name">${esc(p.name)}</div>
        <div class="proj-status">${p.status}</div>
      </div>
      ${pending>0?`<div class="proj-badge">${pending}</div>`:''}
    </div>`;
  }).join('');
}

// Select project
function selectProject(id){
  selProjId=id;renderSidebar();renderContent();
}

// Task view toggle
function setTaskView(v){
  taskView=v;
  document.getElementById('btnPending').classList.toggle('act',v==='pending');
  document.getElementById('btnAll').classList.toggle('act',v==='all');
  if(selProjId)renderContent();
}

// Content area
function renderContent(){
  const content=document.getElementById('projContent');
  if(!selProjId){content.innerHTML='<div class="placeholder"><div class="placeholder-icon">🚧</div><div class="placeholder-text">Select a project from the left<br>to see its tasks</div></div>';return}

  const proj=projects.find(p=>p.id===selProjId);
  const pTasks=tasks.filter(t=>t.projIds.some(id=>id.replaceAll('-','')=== selProjId.replaceAll('-','')));
  const pending=pTasks.filter(t=>t.status!=='Done');
  const done=pTasks.filter(t=>t.status==='Done');
  const pct=pTasks.length?Math.round(done.length/pTasks.length*100):0;
  const display=taskView==='pending'?pending:[...pending,...done];

  document.getElementById('projMeta').textContent=proj?`${pending.length} pending · ${pct}% done`:'';

  content.innerHTML=`
    <div class="proj-content-hdr">
      <div>
        <div class="proj-content-title">${esc(proj?.name||'Project')}</div>
        <div class="proj-content-meta">${pTasks.length} tasks · ${done.length} completed · ${pending.length} remaining</div>
        <div class="proj-progress">
          <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
          <div class="prog-label">${pct}% complete</div>
        </div>
      </div>
    </div>
    <div class="proj-body">
      <div class="ar">
        <input class="ip" id="pjInp" placeholder="Add a task to ${esc(proj?.name||'this project')}…" maxlength="200">
        <select class="se" id="pjPri">
          <option value="">— Priority</option>
          <option value="Priority today">🔴 Today</option>
          <option value="Priority this week">🟡 Week</option>
        </select>
        <button class="ab" id="pjBtn" onclick="addTask()">+</button>
      </div>
      ${!display.length
        ? `<div class="empty">${taskView==='pending'?'No pending tasks — all done! 🎉':'No tasks yet'}</div>`
        : `<div class="tl">${display.map(t=>taskRow(t)).join('')}</div>`
      }
    </div>`;

  document.getElementById('pjInp')?.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addTask()}});
}

// Task row HTML
function taskRow(t){
  const dn=t.status==='Done';
  const pt=t.priority==='Priority today'?'<span class="tg tg-t">Today</span>':t.priority==='Priority this week'?'<span class="tg tg-w">Week</span>':'';
  const st=dn?'<span class="tg tg-d">Done</span>':t.status==='In progress'?'<span class="tg tg-ip">In progress</span>':'<span class="tg tg-o">To do</span>';
  const di=t.doDate?`<div class="tn">${dD(t.doDate)}</div>`:'';
  const ni=t.notes?`<div class="tn">${esc(t.notes)}</div>`:'';
  return `<div class="tw">
    <div class="cb ${dn?'dn':''}" data-id="${t.id}" data-done="${dn}" onclick="checkTask(this)"></div>
    <div style="flex:1;min-width:0"><div class="tx ${dn?'dn':''}">${esc(t.title)}</div>${ni}${di}</div>
    <div class="tags">${pt}${st}</div>
  </div>`;
}

// Add task
async function addTask(){
  if(!selProjId)return;
  const i=document.getElementById('pjInp'),p=document.getElementById('pjPri')?.value,t=i?.value.trim();
  if(!t)return;
  const b=document.getElementById('pjBtn');if(b)b.disabled=true;showS('Adding…','info');
  const today=toYMD(new Date());
  const pr={'Task':{title:[{text:{content:t}}]},'Status':{status:{name:'Not started'}},'Do Date':{date:{start:today}}};
  if(p)pr['Priority Type']={select:{name:p}};
  if(projPropName)pr[projPropName]={relation:[{id:selProjId}]};
  try{
    const d=await crt({parent:{database_id:DB_T},properties:pr});
    if(d.object==='error')throw new Error(d.message);
    if(i)i.value='';showS('Added ✓','ok');await loadAll();
  }catch(e){showS('Error: '+e.message,'err')}
  if(b){b.disabled=false;}
}

// Check off task
async function checkTask(el){
  if(el.dataset.done==='true'||el.classList.contains('bz'))return;
  el.classList.add('bz');showS('Updating…','info');
  try{
    const d=await upd(el.dataset.id,{properties:{'Status':{status:{name:'Done'}}}});
    if(d.object==='error')throw new Error(d.message);
    showS('Done ✓','ok');await loadAll();
  }catch(e){showS('Error','err');el.classList.remove('bz')}
}

// Init
initUI();
(async()=>{await loadSchema();await loadAll();})();
</script>
</body>
</html>
