<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F5EFE4;--card:#fff;--yellow:#F5D060;--pink:#F0A0B4;--sage:#A8C878;--text:#1E1C18;--side:#1E1C18;--muted:rgba(30,28,24,.45);--bdr:rgba(30,28,24,.1);--r:16px;--f:'Outfit',sans-serif}
body{background:var(--bg);font-family:var(--f);color:var(--text);padding:20px 18px 32px;min-height:100vh}
.wrap{max-width:720px;margin:0 auto}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--bdr)}
.hdr-t{font-size:22px;font-weight:800;letter-spacing:-.02em}.hdr-t span{color:#C07090}
.hdr-sub{font-size:12px;color:var(--muted);margin-top:3px}.hdr-date{font-size:12px;font-weight:600;color:var(--muted)}
.sync{font-size:11px;font-weight:600;color:var(--muted);background:transparent;border:1px solid var(--bdr);border-radius:8px;padding:4px 10px;cursor:pointer;font-family:var(--f);margin-top:4px;transition:all .15s}.sync:hover{border-color:var(--text);color:var(--text)}
.sb{border-radius:10px;padding:8px 14px;margin-bottom:12px;font-size:12px;font-weight:500;display:flex;align-items:center}.sb-ok{background:rgba(122,140,110,.15);color:#607850}.sb-err{background:rgba(192,83,58,.12);color:#C04040}.sb-info{background:rgba(192,120,48,.12);color:#A07020}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.sc{border-radius:var(--r);padding:16px;position:relative;overflow:hidden}.sc.yl{background:var(--yellow)}.sc.pk{background:var(--pink)}.sc.sg2{background:var(--sage)}
.sl{font-size:10px;font-weight:600;color:rgba(30,28,24,.5);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}.sn{font-size:30px;font-weight:800;line-height:1;letter-spacing:-.02em}.ss{font-size:10px;font-weight:500;color:rgba(30,28,24,.45);margin-top:3px}.si{position:absolute;bottom:10px;right:12px;font-size:22px;opacity:.2}
.pn{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 2px 12px rgba(30,28,24,.07)}
.ph{padding:12px 16px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between}.pt{font-size:14px;font-weight:700}.pa{display:flex;gap:6px;align-items:center}
.se{background:#fff;border:1px solid var(--bdr);border-radius:8px;padding:6px 8px;font-family:var(--f);font-size:11px;color:var(--text);outline:none;cursor:pointer;max-width:140px}
.pb{font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;border:1px solid var(--bdr);background:transparent;padding:4px 10px;border-radius:20px;font-family:var(--f);transition:all .15s}.pb:hover{border-color:var(--text);color:var(--text)}
.pd{padding:14px 16px}
.ar{display:flex;gap:8px;align-items:center;margin-bottom:14px;background:var(--bg);padding:8px;border-radius:12px}
.ip{flex:1;background:transparent;border:none;padding:6px 8px;font-family:var(--f);font-size:13px;color:var(--text);outline:none}.ip::placeholder{color:var(--muted)}
.ab{width:30px;height:30px;border-radius:8px;border:none;background:var(--side);color:var(--yellow);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .12s;line-height:1}.ab:hover{transform:scale(1.08)}.ab:disabled{opacity:.4;cursor:not-allowed}
.ne{padding:12px 14px;border-radius:11px;background:var(--bg);margin-bottom:6px;display:flex;align-items:center;gap:10px;animation:fu .15s ease-out}.ne:hover{background:#EDE7DC}
@keyframes fu{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.ne-t{font-size:13px;font-weight:500;min-width:0}.ne-m{font-size:11px;color:var(--muted);margin-top:2px}
.tg{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}.tg-n{background:#FFF0E8;color:#906040}.tg-j{background:#E0E8F4;color:#405880}
.tags{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.em{text-align:center;padding:20px 0;font-size:13px;color:var(--muted)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:rgba(30,28,24,.12);border-radius:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr"><div><div class="hdr-t">◻ Quick <span>Notes</span></div><div class="hdr-sub" id="topSub">Loading…</div></div><div class="hdr-r"><div class="hdr-date" id="metaDate"></div><button class="sync" onclick="loadN()">↻ Sync</button></div></div>
  <div id="sBar" style="display:none"></div>
  <div class="sg">
    <div class="sc sg2"><div class="sl">Total Notes</div><div class="sn" id="s1">-</div><div class="ss">in docs</div><div class="si">📄</div></div>
    <div class="sc yl"><div class="sl">This Week</div><div class="sn" id="s2">-</div><div class="ss">edited</div><div class="si">✏️</div></div>
    <div class="sc pk"><div class="sl">Types</div><div class="sn" id="s3">-</div><div class="ss">categories</div><div class="si">🏷️</div></div>
  </div>
  <div class="pn"><div class="ph"><div class="pt">Docs</div><div class="pa"><select class="se" id="fType" onchange="render()"><option value="">All types</option></select><button class="pb" onclick="loadN()">↻</button></div></div><div class="pd">
    <div class="ar">
      <input class="ip" id="nInp" placeholder="New note title…" maxlength="200">
      <select class="se" id="nType"><option value="">Type</option><option value="Random notes">Random</option><option value="Brainstorm">Brainstorm</option><option value="Documentation">Documentation</option><option value="Reports">Reports</option><option value="Meeting notes">Meeting</option><option value="Research">Research</option></select>
      <select class="se" id="nProj" style="max-width:120px"><option value="">Project</option></select>
      <button class="ab" id="nBtn" onclick="addN()">+</button>
    </div>
    <div id="list" style="max-height:500px;overflow-y:auto"><div class="em">Loading…</div></div>
  </div></div>
</div>
<script>
const W='https://ppc-taskplanner.rachel-f0b.workers.dev',DB_N='35934595b2aa8021a54af97806049a38',DB_P='35934595b2aa8034a4eed7794f61ad8d';
let notes=[],projects=[];
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function toYMD(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function ss(m,t){const b=document.getElementById('sBar');b.className='sb sb-'+t;b.textContent=m;b.style.display='flex';if(t!=='err')setTimeout(()=>b.style.display='none',3000)}
function ago(iso){const d=new Date(iso),now=new Date(),m=Math.floor((now-d)/60000);if(m<60)return m+'m ago';const h=Math.floor(m/60);if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago'}
function pn(id){const c=id.replaceAll('-','');const p=projects.find(x=>x.id.replaceAll('-','')=== c);return p?p.name:''}
function initUI(){const n=new Date(),ds=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],ms=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];document.getElementById('metaDate').textContent=`${ds[n.getDay()]}, ${ms[n.getMonth()]} ${n.getDate()}`}
async function loadP(){try{const r=await fetch(`${W}/query/${DB_P}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({page_size:50})});const d=await r.json();projects=(d.results||[]).map(p=>({id:p.id,name:p.properties?.['Name']?.title?.[0]?.plain_text||'Untitled',status:p.properties?.['Status']?.status?.name||''}));const s=document.getElementById('nProj');s.innerHTML='<option value="">Project</option>';projects.filter(p=>p.status!=='Done').forEach(p=>{s.innerHTML+=`<option value="${p.id}">${esc(p.name)}</option>`})}catch(e){}}
async function loadN(){ss('Syncing…','info');if(!projects.length)await loadP();try{const r=await fetch(`${W}/query/${DB_N}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({page_size:50,sorts:[{property:'Last edited time',direction:'descending'}]})});const d=await r.json();
notes=(d.results||[]).map(p=>{const r2=p.properties||{};return{id:p.id,title:r2['Page']?.title?.[0]?.plain_text||'Untitled',types:(r2['Type']?.multi_select||[]).map(x=>x.name),edited:r2['Last edited time']?.last_edited_time||'',projIds:(r2["🚧 Projects "]?.relation||[]).map(x=>x.id)}});
const fS=document.getElementById('fType'),typs=[...new Set(notes.flatMap(x=>x.types))];fS.innerHTML='<option value="">All types</option>';typs.forEach(t=>{fS.innerHTML+=`<option value="${t}">${t}</option>`});
render();ss('Synced ✓','ok');document.getElementById('topSub').textContent=`${notes.length} notes total`}catch(e){ss('Could not load.','err')}}
function render(){const ls=document.getElementById('list'),f=document.getElementById('fType').value;let n=notes;if(f)n=notes.filter(x=>x.types.includes(f));
const now=new Date(),sw=new Date(now);sw.setDate(now.getDate()-now.getDay());const wk=notes.filter(x=>x.edited&&x.edited>=toYMD(sw));const typs=new Set(notes.flatMap(x=>x.types));
document.getElementById('s1').textContent=notes.length;document.getElementById('s2').textContent=wk.length;document.getElementById('s3').textContent=typs.size;
if(!n.length){ls.innerHTML='<div class="em">No notes ☕</div>';return}
ls.innerHTML=n.map(x=>{const tTags=x.types.map(t=>`<span class="tg tg-n">${t}</span>`).join('');const pTags=x.projIds.map(id=>{const nm=pn(id);return nm?`<span class="tg tg-j">${esc(nm)}</span>`:''}).join('');const a=x.edited?ago(x.edited):'';
return `<div class="ne"><div style="font-size:16px;flex-shrink:0">📄</div><div style="flex:1;min-width:0"><div class="ne-t">${esc(x.title)}</div><div class="ne-m">${a}</div></div><div class="tags">${tTags}${pTags}</div></div>`}).join('')}
async function addN(){const i=document.getElementById('nInp'),t=document.getElementById('nType').value,pId=document.getElementById('nProj').value,title=i.value.trim();if(!title)return;
const b=document.getElementById('nBtn');b.disabled=true;b.textContent='…';ss('Creating…','info');
const pr={'Page':{title:[{text:{content:title}}]}};if(t)pr['Type']={multi_select:[{name:t}]};if(pId)pr["🚧 Projects "]={relation:[{id:pId}]};
try{const r=await fetch(`${W}/pages`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({parent:{database_id:DB_N},properties:pr})});const d=await r.json();if(d.object==='error')throw new Error(d.message);i.value='';ss('Created ✓','ok');await loadN()}catch(e){ss('Error: '+e.message,'err')}b.disabled=false;b.textContent='+'}
document.getElementById('nInp').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addN()}});
initUI();loadN();
</script>
</body>
</html>
