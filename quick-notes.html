<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F5EFE4;--card:#fff;--sage:#A8C878;--text:#1E1C18;--side:#1E1C18;--muted:rgba(30,28,24,.45);--bdr:rgba(30,28,24,.1);--r:16px;--f:'Outfit',sans-serif}
body{background:var(--bg);font-family:var(--f);color:var(--text);padding:20px 18px 32px;min-height:100vh}
.wrap{max-width:720px;margin:0 auto}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--bdr)}
.hdr-t{font-size:22px;font-weight:800;letter-spacing:-.02em}.hdr-t span{color:#C07090}
.hdr-sub{font-size:12px;color:var(--muted);margin-top:3px}
.hdr-r{text-align:right}.hdr-date{font-size:12px;font-weight:600;color:var(--muted)}
.save-status{display:flex;align-items:center;gap:5px;justify-content:flex-end;margin-top:4px;font-size:11px;color:var(--muted);font-weight:500}
.sd{width:7px;height:7px;border-radius:50%;background:#80C870;flex-shrink:0}
.pn{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 2px 12px rgba(30,28,24,.07);margin-bottom:14px}
.ph{padding:12px 16px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between}
.pt{font-size:14px;font-weight:700}
.clear-btn{font-size:11px;font-weight:600;color:var(--muted);background:transparent;border:1px solid var(--bdr);border-radius:8px;padding:4px 10px;cursor:pointer;font-family:var(--f);transition:all .15s}.clear-btn:hover{border-color:#C04040;color:#C04040}
.pd{padding:4px}
.notes-area{width:100%;min-height:500px;border:none;background:transparent;padding:16px;font-family:var(--f);font-size:14px;color:var(--text);line-height:1.8;outline:none;resize:none;caret-color:var(--sage)}
.notes-area::placeholder{color:var(--muted)}
.footer{text-align:center;margin-top:6px;font-size:10px;color:var(--muted);letter-spacing:.06em}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div>
      <div class="hdr-t">◻ Quick <span>Notes</span></div>
      <div class="hdr-sub">Your personal scratchpad — autosaved</div>
    </div>
    <div class="hdr-r">
      <div class="hdr-date" id="metaDate"></div>
      <div class="save-status"><div class="sd" id="saveDot"></div><span id="saveLabel">saved</span></div>
    </div>
  </div>

  <div class="pn">
    <div class="ph">
      <div class="pt">Notes</div>
      <button class="clear-btn" onclick="clearNotes()">✕ Clear all</button>
    </div>
    <div class="pd">
      <textarea class="notes-area" id="notesArea" placeholder="Start typing… brain dumps, reminders, follow-ups, ideas. Everything here autosaves."></textarea>
    </div>
  </div>

  <div class="footer" id="charCount">0 characters</div>
</div>

<script>
const KEY = 'ppc_quicknotes_v1';
const area = document.getElementById('notesArea');
let saveTimer;

function initUI() {
  const n = new Date();
  const ds = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const ms = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('metaDate').textContent = `${ds[n.getDay()]}, ${ms[n.getMonth()]} ${n.getDate()}`;
}

function load() {
  const saved = localStorage.getItem(KEY);
  if (saved) {
    area.value = saved;
    updateCount();
  }
}

function save() {
  localStorage.setItem(KEY, area.value);
  document.getElementById('saveDot').style.background = '#80C870';
  document.getElementById('saveLabel').textContent = 'saved';
  updateCount();
}

function updateCount() {
  const chars = area.value.length;
  const words = area.value.trim() ? area.value.trim().split(/\s+/).length : 0;
  document.getElementById('charCount').textContent = `${words} words · ${chars} characters`;
}

function clearNotes() {
  if (!area.value.trim()) return;
  if (confirm('Clear all notes? This cannot be undone.')) {
    area.value = '';
    save();
  }
}

area.addEventListener('input', () => {
  document.getElementById('saveDot').style.background = '#F5C524';
  document.getElementById('saveLabel').textContent = 'saving…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 800);
  updateCount();
});

area.addEventListener('keydown', e => {
  // Tab key inserts spaces instead of losing focus
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = area.selectionStart, end = area.selectionEnd;
    area.value = area.value.substring(0, start) + '    ' + area.value.substring(end);
    area.selectionStart = area.selectionEnd = start + 4;
  }
});

initUI();
load();
</script>
</body>
</html>
